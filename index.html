<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="GenApp Diesel - Diesel fuel management system with real-time tracking">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>GenApp</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase compat SDK (loaded first, no module needed) -->
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="header">
        <div class="logo">
            <button class="mobile-menu-btn" data-action="toggleSidebar">&#9776;</button>
            <div class="logo-icon">⛽</div>
            <div class="logo-text">GenApp</div>
        </div>
        <div class="header-right">
            <div class="user-info" data-action="toggleProfileDropdown">
                <div class="header-user-name" id="user-name">Faisal Ahmad</div>
                <div class="user-role" id="user-role">Admin</div>
                <div class="user-avatar" id="user-avatar">F</div>
            </div>
            <div class="user-profile-dropdown" id="profile-dropdown">
                <div class="dropdown-divider"></div>
                <button class="dropdown-item logout" data-action="logoutWithConfirm">Keluar</button>
            </div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebar-overlay" data-action="toggleSidebar"></div>

    <div class="container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"></div>
            <ul class="nav-menu" id="nav-menu"></ul>
        </aside>

        <main class="content">
            <div class="page-header">
                <h1 id="page-title"></h1>
                <div class="page-subtitle" id="page-subtitle"></div>
            </div>
            <div id="content-area"></div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="add-modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title" id="modal-title"></div>
                <button class="modal-close" data-action="closeAddModal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
